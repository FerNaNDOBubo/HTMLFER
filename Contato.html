<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Contate-nos - Livraria Ficcional do Fernando</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contato.css">
</head>

<body class="pagina-contato">

    <div id="topo">

        <h1 style="color: red; text-align: center;">
            Livraria Ficcional do Fernando
        </h1>

        <h2 style="text-align: center;">
            Livros novos e usados com os melhores preços para você
        </h2>

    </div>

    <div id="menu">

        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Livros</a></li>
            <li><a href="produtos.html">Promoções</a></li>
            <li><a href="sobre.html">Sobre Nos</a></li>
            <li><a href="contato.html">Contate-nos</a></li>
        </ul>

    </div>

    <div class="contato">

        <form>

            <fieldset>

                <legend>Contate-nos</legend>

                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome">
                </p>

                <p>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone">
                </p>

                <p>
                    <label for="assunto">Assunto:</label>

                    <select id="assunto" name="assunto">

                        <option value="">Selecione --</option>
                        <option value="trocas">Trocas</option>
                        <option value="atendimento">Atendimento</option>
                        <option value="comercial">Comercial</option>
                        <option value="outros">Outros</option>

                    </select>
                </p>

                <p>
                    <label for="mensagem">Mensagem:</label>
                </p>

                <p>
                    <textarea id="mensagem" name="mensagem" rows="6" cols="40"></textarea>
                </p>

                <p>
                    <input type="checkbox" id="receber" name="receber">

                    <label for="receber">
                        Desejo receber novidades da livraria.
                    </label>
                </p>

                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>

            </fieldset>

        </form>

    </div>

    <div id="rodape">

        <p>Livraria Ficcional do Fernando</p>

        <a href="index.html">Início</a> |
        <a href="produtos.html">Livros</a> |
        <a href="produtos.html">Promoções</a> |
        <a href="sobre.html">Sobre Nos</a> |
        <a href="contato.html">Contate-nos</a>

    </div>

</body>

</html>
